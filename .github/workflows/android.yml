name: Build Android APK
on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Production Files
        run: npm run build

      - name: Inject Native Mobile Wrapper
        run: |
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android
          npx cap init "Snap Crackle Trivia" "com.bluegrouse.trivia" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Set up Java JDK 17 Environment
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Compile Installable Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: snap-crackle-trivia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

