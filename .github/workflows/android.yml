name: Build Android APK
on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Production Files
        run: npm run build

      - name: Set up Java JDK 21 Environment
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Inject Native Mobile Wrapper
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Snap Crackle Trivia" "com.bluegrouse.trivia" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Patch Root Gradle File for Kotlin Conflict
        run: |
          # Use a modern Kotlin resolution strategy targeted inside the buildscript configuration block
          # This replaces the entire file with a clean block that natively handles the duplicate stdlib conflicts.
          cat > android/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
              configurations.all {
                  resolutionStrategy {
                      // Forces all plugins to use a modern, aligned version of the stdlib
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                  }
              }
          }
          
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Compile Installable Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: snap-crackle-trivia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
