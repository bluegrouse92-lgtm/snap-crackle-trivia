name: Build Android APK
on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Production Files
        run: npm run build

      - name: Set up Java JDK 21 Environment
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Inject Native Mobile Wrapper
        run: |
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android
          npx cap init "Snap Crackle Trivia" "com.bluegrouse.trivia" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Patch Root Gradle File for Kotlin Stdlib Conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin' &&
                              (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                              details.useTarget group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib', version: '1.8.22'
                          }
                      }
                  }
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF
          echo "----- android/build.gradle (last 25 lines) -----"
          tail -n 25 android/build.gradle

      - name: Dump Dependency Info for Debugging
        run: |
          echo "===== android/build.gradle (full) ====="
          cat android/build.gradle
          echo ""
          echo "===== Full dependency tree (grep kotlin-stdlib) ====="
          cd android
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > deps.txt 2>&1 || true
          grep -i "kotlin-stdlib" deps.txt || echo "No kotlin-stdlib lines found"

      - name: Compile Installable Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: snap-crackle-trivia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
