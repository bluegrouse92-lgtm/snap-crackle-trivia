name: Weekly 500-Question Trivia Refresh 🗓️

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  refresh-questions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Fresh Weekly 500 Questions Offline
        run: npm run update-questions

      - name: Commit and Push Weekly Question Bank
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weeklyQuestions.json
          if git diff --staged --quiet; then
            echo "No changes to weekly questions detected."
          else
            git commit -m "chore(trivia): refresh 500-question weekly bank for $(date -u +'%Y-W%V')"
            git push origin main
          fi
